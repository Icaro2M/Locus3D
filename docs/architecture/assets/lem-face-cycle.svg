<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">

<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#6b7280" />
    </marker>
</defs>


<style>
    .bg { fill: #ffffff; }
    .title { font: 700 22px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 400 13px Arial, sans-serif; fill: #4b5563; }
    .label { font: 600 14px Arial, sans-serif; fill: #111827; }
    .small { font: 400 12px Arial, sans-serif; fill: #374151; }
    .node { fill: #f9fafb; stroke: #111827; stroke-width: 1.5; }
    .soft { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .edge { stroke: #111827; stroke-width: 2; fill: none; }
    .thin { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .dash { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrow-soft { stroke: #6b7280; stroke-width: 1.8; fill: none; marker-end: url(#arrowSoft); }
    .radial { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .loop { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
    .vertex { fill: #111827; stroke: #111827; stroke-width: 1; }
    .accent { fill: #e5e7eb; stroke: #111827; stroke-width: 1.5; }
</style>

<rect class="bg" x="0" y="0" width="960" height="620"/>
<text class="title" x="48" y="56">LEM face cycle</text>
<text class="subtitle" x="48" y="80">Loops linked by next/previous around a polygonal face boundary.</text>

<polygon points="300,160 660,160 660,460 300,460" class="accent"/>
<line class="edge" x1="300" y1="160" x2="660" y2="160"/>
<line class="edge" x1="660" y1="160" x2="660" y2="460"/>
<line class="edge" x1="660" y1="460" x2="300" y2="460"/>
<line class="edge" x1="300" y1="460" x2="300" y2="160"/>

<circle class="vertex" cx="300" cy="160" r="6"/>
<circle class="vertex" cx="660" cy="160" r="6"/>
<circle class="vertex" cx="660" cy="460" r="6"/>
<circle class="vertex" cx="300" cy="460" r="6"/>

<circle class="loop" cx="340" cy="200" r="28"/>
<circle class="loop" cx="620" cy="200" r="28"/>
<circle class="loop" cx="620" cy="420" r="28"/>
<circle class="loop" cx="340" cy="420" r="28"/>

<text class="label" x="340" y="205" text-anchor="middle">l0</text>
<text class="label" x="620" y="205" text-anchor="middle">l1</text>
<text class="label" x="620" y="425" text-anchor="middle">l2</text>
<text class="label" x="340" y="425" text-anchor="middle">l3</text>

<text class="small" x="285" y="145" text-anchor="end">v0</text>
<text class="small" x="675" y="145">v1</text>
<text class="small" x="675" y="480">v2</text>
<text class="small" x="285" y="480" text-anchor="end">v3</text>

<path class="arrow" d="M372 200 C445 168, 515 168, 588 200"/>
<path class="arrow" d="M620 232 C648 285, 648 335, 620 388"/>
<path class="arrow" d="M588 420 C515 452, 445 452, 372 420"/>
<path class="arrow" d="M340 388 C312 335, 312 285, 340 232"/>

<text class="small" x="480" y="146" text-anchor="middle">next</text>
<text class="small" x="687" y="312">next</text>
<text class="small" x="480" y="495" text-anchor="middle">next</text>
<text class="small" x="244" y="312">next</text>

<rect class="soft" x="308" y="525" rx="12" ry="12" width="344" height="48"/>
<text class="small" x="480" y="554" text-anchor="middle">The face stores one loop; the full boundary is reached by traversal.</text>
</svg>
