<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">

<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
    <marker id="arrowSoft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#6b7280" />
    </marker>
</defs>


<style>
    .bg { fill: #ffffff; }
    .title { font: 700 22px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 400 13px Arial, sans-serif; fill: #4b5563; }
    .label { font: 600 14px Arial, sans-serif; fill: #111827; }
    .small { font: 400 12px Arial, sans-serif; fill: #374151; }
    .node { fill: #f9fafb; stroke: #111827; stroke-width: 1.5; }
    .soft { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .edge { stroke: #111827; stroke-width: 2; fill: none; }
    .thin { stroke: #6b7280; stroke-width: 1.5; fill: none; }
    .dash { stroke: #6b7280; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
    .arrow { stroke: #111827; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrow-soft { stroke: #6b7280; stroke-width: 1.8; fill: none; marker-end: url(#arrowSoft); }
    .radial { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .loop { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
    .vertex { fill: #111827; stroke: #111827; stroke-width: 1; }
    .accent { fill: #e5e7eb; stroke: #111827; stroke-width: 1.5; }
</style>

<rect class="bg" x="0" y="0" width="960" height="620"/>
<text class="title" x="48" y="56">LEM core elements</text>
<text class="subtitle" x="48" y="80">Vertex, Edge, Loop and Face relationships in the Locus Editable Mesh.</text>

<rect class="node" x="370" y="118" rx="14" ry="14" width="220" height="86"/>
<text class="label" x="480" y="153" text-anchor="middle">Loop</text>
<text class="small" x="480" y="176" text-anchor="middle">directed face corner</text>

<rect class="node" x="80" y="292" rx="14" ry="14" width="200" height="82"/>
<text class="label" x="180" y="326" text-anchor="middle">Vertex</text>
<text class="small" x="180" y="349" text-anchor="middle">geometric point</text>

<rect class="node" x="380" y="292" rx="14" ry="14" width="200" height="82"/>
<text class="label" x="480" y="326" text-anchor="middle">Edge</text>
<text class="small" x="480" y="349" text-anchor="middle">non-directional link</text>

<rect class="node" x="680" y="292" rx="14" ry="14" width="200" height="82"/>
<text class="label" x="780" y="326" text-anchor="middle">Face</text>
<text class="small" x="780" y="349" text-anchor="middle">polygonal region</text>

<path class="arrow" d="M424 204 C365 242, 297 273, 232 292"/>
<text class="small" x="306" y="249" text-anchor="middle">uses vertex</text>

<path class="arrow" d="M480 204 L480 292"/>
<text class="small" x="510" y="251">uses edge</text>

<path class="arrow" d="M536 204 C603 242, 680 274, 728 292"/>
<text class="small" x="650" y="249" text-anchor="middle">belongs to face</text>

<path class="arrow-soft" d="M280 333 L380 333"/>
<text class="small" x="330" y="318" text-anchor="middle">connects</text>

<path class="dash" d="M580 333 L680 333"/>
<text class="small" x="630" y="318" text-anchor="middle">bounds</text>

<rect class="soft" x="288" y="458" rx="12" ry="12" width="384" height="76"/>
<text class="label" x="480" y="489" text-anchor="middle">Key rule</text>
<text class="small" x="480" y="512" text-anchor="middle">A Loop is the use of one Vertex and one Edge inside one Face.</text>
</svg>
